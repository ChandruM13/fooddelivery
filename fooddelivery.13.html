<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery App</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="fooddelivery.13.html">
</head>

<body>

<div class="mobile-container">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold">Hi, Chandru 👋</h3>
            <small class="text-muted">
                <i class="fa-solid fa-location-dot text-danger"></i>
                Home Delivery
            </small>
        </div>

        <img src="https://i.pravatar.cc/60?img=12"
             class="profile rounded-circle">
    </div>

    <!-- Search -->
    <div class="input-group mb-4">
        <span class="input-group-text bg-white">
            <i class="fa fa-search"></i>
        </span>

        <input type="text"
               class="form-control"
               placeholder="Search food...">
    </div>

    <!-- Banner -->
    <div class="banner mb-4">

        <div>
            <h2>50% OFF</h2>
            <p>On your first order</p>

            <button class="btn btn-warning">
                Order Now
            </button>
        </div>

        <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400">

    </div>

    <!-- Categories -->

    <h5 class="mb-3">Categories</h5>

    <div class="d-flex justify-content-between text-center mb-4">

        <div class="category">
            🍕
            <p>Pizza</p>
        </div>

        <div class="category">
            🍔
            <p>Burger</p>
        </div>

        <div class="category">
            🍗
            <p>Chicken</p>
        </div>

        <div class="category">
            🥤
            <p>Drinks</p>
        </div>

    </div>

    <!-- Restaurants -->

    <h5 class="mb-3">Popular Restaurants</h5>

    <div class="row g-3">

        <!-- Card 1 -->

        <div class="col-12">

            <div class="card food-card">

                <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=800"
                     class="card-img-top">

                <div class="card-body">

                    <h5>Italian Pizza</h5>

                    <p class="text-muted">
                        ⭐ 4.8 | ⏱ 25 min
                    </p>

                    <div class="d-flex justify-content-between">

                        <h5 class="text-warning">$12.99</h5>

                        <button class="btn btn-warning">
                            <i class="fa fa-plus"></i>
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- Card 2 -->

        <div class="col-12">

            <div class="card food-card">

                <img src="https://images.unsplash.com/photo-1550547660-d9450f859349?w=800"
                     class="card-img-top">

                <div class="card-body">

                    <h5>Cheese Burger</h5>

                    <p class="text-muted">
                        ⭐ 4.9 | ⏱ 18 min
                    </p>

                    <div class="d-flex justify-content-between">

                        <h5 class="text-warning">$10.50</h5>

                        <button class="btn btn-warning">
                            <i class="fa fa-plus"></i>
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- Card 3 -->

        <div class="col-12">

            <div class="card food-card">

                <img src="https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=800"
                     class="card-img-top">

                <div class="card-body">

                    <h5>Fried Chicken</h5>

                    <p class="text-muted">
                        ⭐ 4.7 | ⏱ 20 min
                    </p>

                    <div class="d-flex justify-content-between">

                        <h5 class="text-warning">$15.00</h5>

                        <button class="btn btn-warning">
                            <i class="fa fa-plus"></i>
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- Card 4 -->

        <div class="col-12">

            <div class="card food-card">

                <img src="https://images.unsplash.com/photo-1627308595229-7830a5c91f9f?w=800"
                     class="card-img-top">

                <div class="card-body">

                    <h5>Chocolate Shake</h5>

                    <p class="text-muted">
                        ⭐ 4.9 | ⏱ 10 min
                    </p>

                    <div class="d-flex justify-content-between">

                        <h5 class="text-warning">$8.99</h5>

                        <button class="btn btn-warning">
                            <i class="fa fa-plus"></i>
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Bottom Navigation -->

    <div class="bottom-nav">

        <i class="fa-solid fa-house active"></i>

        <i class="fa-solid fa-heart"></i>

        <i class="fa-solid fa-cart-shopping"></i>

        <i class="fa-solid fa-user"></i>

    </div>

</div>

</body>
</html>
